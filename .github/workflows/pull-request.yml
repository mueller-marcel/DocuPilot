name: Pull Request

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install --upgrade pip && python -m pip install "poetry==2.3.0"

      - name: Validate Poetry configuration
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Install system libraries for Qt and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: poetry run pytest tests -q -ra

      - name: Build package
        run: poetry build