[project]
name = "DocuPilot"
version = "0.0.1"
description = "Records the screen, audio and input events to create user manuals"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pyside6>=6.7",
    "pynput (>=1.8.1,<2.0.0)",
    "sounddevice (>=0.5.5,<0.6.0)",
    "mss (>=10.2.0,<11.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "scipy-stubs (>=1.17.1,<1.18.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "np (>=1.0.2,<2.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "imagehash (>=4.3.2,<5.0.0)",
    "scikit-image (>=0.26.0,<0.27.0)",
    "pillow (>=12.2.0,<13.0.0)",
]

[project.scripts]
docupilot = "docupilot.app:run"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"