[project]
name = "DocuPilot"
version = "0.0.1"
description = "Records the screen, audio and input events to create user manuals"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pyside6>=6.7",
    "mss (>=10.2.0,<11.0.0)",
    "pynput (>=1.8.1,<2.0.0)",
    "opencv-python (>=4.13.0.92,<5.0.0.0)",
    "imagehash (>=4.3.2,<5.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "openai-whisper (>=20250625)",
    # 3.8.14 hat kein Wheel fuer Python 3.14, poetry install bricht sonst ab.
    "spacy (==3.8.13)",
    # Von SentenceSegmenter zur Laufzeit ueber spacy.load() geladen — taucht in
    # keinem import auf und wuerde von jedem Dead-Code-Check uebersehen.
    "de_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
    "numpy (>=2.4.6,<3.0.0)",
    "anthropic (>=0.116,<1.0)",
]

[project.scripts]
docupilot = "docupilot.app:run"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"